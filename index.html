<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>LewFam — House of Lewis</title>
  <meta name="description" content="The Lewis family crest. House of Lewis — III." />
  <meta name="theme-color" content="#0c100e" />
  <meta property="og:title" content="LewFam — House of Lewis" />
  <meta property="og:description" content="The Lewis family crest." />
  <meta property="og:image" content="/crest.jpg" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="/crest.jpg" type="image/jpeg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --gold: #c4b07a;
      --cream: #f3ead4;
      --bg: #0c100e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--cream); }
    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Cormorant Garamond", Georgia, serif;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse at 50% 42%, rgba(44, 74, 56, 0.38) 0%, rgba(12, 16, 14, 0.15) 46%, #0c100e 72%),
        #0c100e;
    }
    .grain {
      pointer-events: none;
      position: fixed;
      inset: 0;
      opacity: 0.07;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      z-index: 2;
    }
    main {
      position: relative;
      z-index: 1;
      width: min(92vw, 680px);
      padding: 6vh 4vw 8vh;
      text-align: center;
      animation: rise 1.15s ease-out both;
    }
    .mark {
      font-family: Cinzel, serif;
      letter-spacing: 0.48em;
      font-size: 0.7rem;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 1.45rem;
    }
    .crest-wrap {
      position: relative;
      margin: 0 auto 1.7rem;
      width: min(86vw, 540px);
      padding: 0.85rem;
    }
    .crest-wrap::before {
      content: "";
      position: absolute;
      inset: 0;
      border: 1px solid rgba(196, 176, 122, 0.22);
      pointer-events: none;
    }
    img.crest {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 2px;
      box-shadow:
        0 0 0 1px rgba(196, 176, 122, 0.1),
        0 28px 70px rgba(0, 0, 0, 0.55),
        0 0 110px rgba(80, 110, 70, 0.12);
    }
    h1 {
      font-family: Cinzel, serif;
      font-weight: 700;
      font-size: clamp(1.55rem, 5vw, 2.4rem);
      letter-spacing: 0.32em;
      color: var(--cream);
      margin-bottom: 0.2rem;
    }
    .rule {
      width: 64px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 0.95rem auto;
    }
    p.sub {
      font-size: clamp(1rem, 2.6vw, 1.2rem);
      font-style: italic;
      color: #c9c0a8;
      letter-spacing: 0.08em;
    }
    footer {
      margin-top: 2.1rem;
      font-family: Cinzel, serif;
      font-size: 0.62rem;
      letter-spacing: 0.42em;
      color: #6d7468;
      text-transform: uppercase;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(16px) scale(0.985); }
      to { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) { main { animation: none; } }
    @media (max-height: 700px) {
      .mark { margin-bottom: 0.7rem; }
      .crest-wrap { margin-bottom: 1rem; padding: 0.55rem; }
      footer { margin-top: 1.2rem; }
    }
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <main>
    <div class="mark">House of Lewis</div>
    <div class="crest-wrap">
      <img class="crest" src="crest.jpg" width="800" height="800" alt="Lewis family crest: a scorpion on a shield, crossed swords, leaves, III, and the name Lewis" />
    </div>
    <h1>LEWFAM</h1>
    <div class="rule"></div>
    <p class="sub">III &middot; Lewis</p>
    <footer>LewFam.FYI</footer>
  </main>
</body>
</html>
