<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LewFam — House of Lewis</title>
  <meta name="description" content="The Lewis family crest. House of Lewis." />
  <meta name="theme-color" content="#0d1210" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <meta property="og:title" content="LewFam — House of Lewis" />
  <meta property="og:description" content="The Lewis family crest." />
  <meta property="og:image" content="/crest.jpg" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1a2a22;
      --green: #2c4a38;
      --gold: #c4b07a;
      --cream: #f3ead4;
      --bg: #0c100e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--cream);
    }

    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Cormorant Garamond", Georgia, serif;
      overflow-x: hidden;
    }

    .grain {
      pointer-events: none;
      position: fixed;
      inset: 0;
      opacity: 0.07;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      z-index: 2;
    }

    .glow {
      position: fixed;
      width: min(80vw, 720px);
      height: min(80vw, 720px);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(44,74,56,0.35) 0%, rgba(12,16,14,0) 70%);
      z-index: 0;
    }

    main {
      position: relative;
      z-index: 1;
      width: min(92vw, 720px);
      padding: 6vh 4vw 8vh;
      text-align: center;
      animation: rise 1.1s ease-out both;
    }

    .mark {
      font-family: Cinzel, serif;
      letter-spacing: 0.55em;
      font-size: 0.72rem;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 1.6rem;
    }

    .crest-wrap {
      position: relative;
      margin: 0 auto 1.8rem;
      width: min(88vw, 560px);
    }

    .crest-wrap::before {
      content: "";
      position: absolute;
      inset: 6%;
      border-radius: 8px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.55);
      z-index: -1;
    }

    img.crest {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 4px;
      filter: drop-shadow(0 18px 40px rgba(0,0,0,0.45));
    }

    h1 {
      font-family: Cinzel, serif;
      font-weight: 700;
      font-size: clamp(1.8rem, 6vw, 3.2rem);
      letter-spacing: 0.28em;
      color: var(--cream);
      margin-bottom: 0.45rem;
    }

    p.sub {
      font-size: clamp(1rem, 2.6vw, 1.25rem);
      font-style: italic;
      color: #c9c0a8;
      letter-spacing: 0.08em;
    }

    .rule {
      width: 64px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 1.15rem auto;
    }

    footer {
      margin-top: 2.4rem;
      font-family: Cinzel, serif;
      font-size: 0.62rem;
      letter-spacing: 0.42em;
      color: #6d7468;
      text-transform: uppercase;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      main { animation: none; }
    }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>
  <main>
    <div class="mark">Est. House of Lewis</div>
    <div class="crest-wrap">
      <img class="crest" src="/crest.jpg" alt="Lewis family crest: a scorpion on a shield, crossed swords, hemp leaves, and the name Lewis" />
    </div>
    <h1>LEWFAM</h1>
    <div class="rule"></div>
    <p class="sub">House of Lewis &middot; III</p>
    <footer>LewFam.FYI</footer>
  </main>
</body>
</html>
